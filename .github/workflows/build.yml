name: Build and publish branch

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag (leave empty to use selected branch)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve image tag
        id: tag
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF_TYPE" = branch || { echo "Select a branch."; exit 1; }
          tag="$(bash scripts/image-tag.sh "$GITHUB_REF_NAME" "$CUSTOM_TAG")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/integration.yml

  publish:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: branch-image-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare image name
        id: image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.image.outputs.name }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
