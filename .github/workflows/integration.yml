name: Integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version_tag:
        description: Canonical release tag for versioned builds
        type: string
        default: latest
      release_artifact:
        description: Upload the static release ZIP
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: node --test server/*.test.mjs
      - run: bash scripts/test-tags.sh
      - name: Set build version
        env:
          VERSION: ${{ inputs.version_tag || 'latest' }}
        run: |
          if [ "$VERSION" != latest ]; then
            node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json")); p.version = process.env.VERSION.slice(1); fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          fi
      - run: pnpm build
      - name: Verify isolated administrative build
        run: |
          test -f dist/index.html
          test -f dist-admin/index.html
          test ! -e dist/admin
          test -d dist-admin/resources
          test -f dist/sw.js
          if grep -F 'admin/resources/' dist/sw.js; then exit 1; fi
      - name: Build Docker image
        env:
          VERSION: ${{ inputs.version_tag || 'latest' }}
        run: docker build --build-arg "VERSION_TAG=$VERSION" -t homer:ci .
      - name: Smoke test both administration modes
        run: bash scripts/smoke-image.sh homer:ci
      - name: Create static release ZIP
        if: inputs.release_artifact
        run: (cd dist && zip -r ../homer.zip .)
      - uses: actions/upload-artifact@v4
        if: inputs.release_artifact
        with:
          name: homer-static
          path: homer.zip
          if-no-files-found: error
