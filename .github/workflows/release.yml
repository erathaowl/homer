name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vX.Y or vX.Y.Z; blank uses package.json)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      original: ${{ steps.version.outputs.original }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            original="$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF_NAME" = main || { echo "Select main for a manual release."; exit 1; }
            original="${REQUESTED_VERSION:-v$(node -p "require('./package.json').version")}"
            [[ "$original" == v* ]] || original="v$original"
          fi
          version="$(bash scripts/release-version.sh "$original")"
          commit="$(git rev-parse HEAD)"
          if git rev-parse --verify "refs/tags/$version" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$version^{commit}")" = "$commit" || {
              echo "Canonical tag $version points to another commit" >&2
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "original=$original" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/integration.yml
    with:
      version_tag: ${{ needs.prepare.outputs.version }}
      release_artifact: true

  tag:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create canonical tag after successful checks
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          commit="$(git rev-parse HEAD)"
          if git rev-parse --verify "refs/tags/$VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$commit"
          else
            git tag "$VERSION" "$commit"
            git push origin "refs/tags/$VERSION"
          fi

  publish:
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare image tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ORIGINAL: ${{ needs.prepare.outputs.original }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:$VERSION"
            echo "$image:${VERSION#v}"
            if [[ "$VERSION" != "$ORIGINAL" ]]; then
              echo "$image:$ORIGINAL"
            fi
            echo "$image:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: VERSION_TAG=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homer-static
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: homer.zip
          fail_on_unmatched_files: true
