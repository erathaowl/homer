name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="$(bash scripts/release-version.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          commit="$(git rev-parse HEAD)"
          if git rev-parse --verify "refs/tags/$version" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$version^{commit}")" = "$commit" || {
              echo "Canonical tag $version points to another commit" >&2
              exit 1
            }
          else
            git tag "$version" "$commit"
            git push origin "refs/tags/$version"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - name: Build versioned static ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json")); p.version = process.env.VERSION.slice(1); fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")'
          pnpm build
          (cd dist && zip -r ../homer.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: homer-static
          path: homer.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:$VERSION"
            echo "$image:${VERSION#v}"
            if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
              echo "$image:$GITHUB_REF_NAME"
            fi
            echo "$image:latest"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: VERSION_TAG=${{ needs.build.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homer-static
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: homer.zip
          fail_on_unmatched_files: true
